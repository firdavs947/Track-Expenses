name: track_expenses
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  adaptive_theme: ^3.7.2
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  path: ^1.9.1
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/lotties/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: Jet
      fonts:
        - asset: assets/fonts/jet_brains.ttf
        
               
