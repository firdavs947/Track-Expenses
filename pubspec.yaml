name: track_expenses
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  adaptive_theme: ^3.7.2
  animate_do: ^5.1.0
  audioplayers: ^6.7.1
  cupertino_icons: ^1.0.9
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  lottie: ^3.3.3
  open_file: ^4.0.0
  path: ^1.9.1
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  sqflite: ^2.4.2+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/lotties/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: Jet
      fonts:
        - asset: assets/fonts/jet_brains.ttf
        
               
